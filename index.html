<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RSU Permata Hati</title>
  <link rel="icon" type="image/png" href="icons/icon.png">
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="shortcut icon" href="icons/icon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.json">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>
  <div id="contact"></div>
  <nav id="nav" class="sticky-top bg-body shadow-sm"></nav>
  <main id="content"></main>
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    function loadLayout(elementId, filePath) {
      return fetch(filePath)
        .then(response => {
          if (!response.ok) throw new Error(`Error loading file: ${filePath}`);
          return response.text();
        })
        .then(htmlContent => {
          document.getElementById(elementId).innerHTML = htmlContent;
        })
        .catch(error => console.error("Error Layout:", error));
    }

    document.addEventListener("DOMContentLoaded", () => {
      Promise.all([
        loadLayout("contact", "components/contact.html"),
        loadLayout("nav", "components/nav.html"),
        loadLayout("content", "pages/home/home.html"),
        loadLayout("footer", "components/footer.html")
      ]).then(() => {
        AOS.init();
      });
      alert("Selamat datang di RSU Permata Hati! Website sedang dalam pengembangan.");
    });
  </script>
</body>

</html>
