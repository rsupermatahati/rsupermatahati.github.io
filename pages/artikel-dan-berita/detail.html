<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Artikel - RSU Permata Hati</title>

  <link rel="icon" type="image/png" href="/icons/icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <div id="theme"></div>
  <div id="contact"></div>
  <nav id="nav" class="sticky-top bg-body shadow-sm"></nav>
  <header id="header"></header>

  <div class="container">
    <div class="row py-5">
      <div class="col-12 col-lg-8 p-0">
        <!-- LANGSUNG TARUH WADAH ARTIKEL DI SINI (TANPA FETCH CONTENT.HTML) -->
        <main id="content" class="container">
          <article class="pe-lg-4" id="article-detail-container">
            <div class="text-center py-5">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Memuat artikel...</span>
              </div>
            </div>
          </article>
        </main>
      </div>

      <div class="col-12 col-lg-4 p-0">
        <aside id="fb"></aside>
      </div>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="/js/color-modes.js"></script>
  <script src="/js/style.js"></script>
  <script src="/js/translate.js"></script>
  <script src="articles.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    function loadLayout(elementId, filePath) {
      return fetch(filePath)
        .then(response => {
          if (!response.ok) throw new Error(`Error loading file: ${filePath}`);
          return response.text();
        })
        .then(htmlContent => {
          document.getElementById(elementId).innerHTML = htmlContent;
        })
        .catch(error => console.error("Error Layout:", error));
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Hapus loadLayout untuk "content" karena sudah ditulis langsung di HTML atas
      Promise.all([
        loadLayout("theme", "/components/theme.html"),
        loadLayout("contact", "/components/contact.html"),
        loadLayout("nav", "/components/nav.html"),
        loadLayout("header", "/components/header.html"),
        loadLayout("fb", "/components/fb.html"),
        loadLayout("footer", "/components/footer.html")
      ]).then(() => {
        if (typeof initTheme === 'function') initTheme();
        if (typeof translateInit === 'function') translateInit();
        
        // Panggil fungsi render artikel
        if (typeof initArticleDetail === 'function') initArticleDetail();

        if (typeof initTheme === 'function') initTheme(); 
        if (typeof initPopup === 'function') initPopup(); 
        if (typeof translateInit === 'function') translateInit(); 
        AOS.init();
      });
    });
  </script>
</body>

</html>
