<div class="dropdown position-fixed bottom-0 end-0 mb-2 me-2 bd-mode-toggle" style="z-index: 9999;">
    <!-- Tombol Utama Theme Switcher -->
    <button class="btn btn-success rounded-4 d-flex justify-content-center align-items-center fs-4 p-1" id="bd-theme" type="button"
        aria-expanded="false" data-bs-toggle="dropdown" aria-label="Toggle theme" style="width: 3rem; height: 3rem; line-height: 0;">
        <i class="bi bi-sun-fill theme-icon-active"></i>
        <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
    </button>

    <!-- Menu Dropdown -->
    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
        <li>
            <button id="goUpButton" onclick="scrollToTop()" type="button"
                class="dropdown-item d-flex align-items-center">
                <i class="bi bi-arrow-up-circle-fill me-2 text-secondary"></i>
                <span>Go Up</span>
            </button>
        </li>
        <li>
            <hr class="dropdown-divider">
        </li>
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="light"
                aria-pressed="true">
                <i class="bi bi-sun-fill me-2 opacity-50"></i>
                <span>Light</span>
                <i class="bi bi-check2 ms-auto d-none"></i>
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark"
                aria-pressed="false">
                <i class="bi bi-moon-stars-fill me-2 opacity-50"></i>
                <span>Dark</span>
                <i class="bi bi-check2 ms-auto d-none"></i>
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="auto"
                aria-pressed="false">
                <i class="bi bi-circle-half me-2 opacity-50"></i>
                <span>Auto</span>
                <i class="bi bi-check2 ms-auto d-none"></i>
            </button>
        </li>
    </ul>
</div>
